name: AI Self-Healing Proxy v7

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-self-healing-proxy-v7
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade requests pyyaml

      - name: Generate Clash subscription
        run: |
          python generator.py
          mkdir -p docs
          cp output/clash.yaml docs/clash.yaml
          touch docs/.nojekyll

      - name: Publish to kzeng.github.io clash branch
        env:
          PAGES_REPO_TOKEN: ${{ secrets.KZENG_PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_REPO_TOKEN" ]; then
            echo "::error::Missing secret KZENG_PAGES_TOKEN (PAT with repo scope for kzeng/kzeng.github.io)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PAGES_REPO="https://x-access-token:${PAGES_REPO_TOKEN}@github.com/kzeng/kzeng.github.io.git"

          if git ls-remote --exit-code "$PAGES_REPO" refs/heads/clash >/dev/null 2>&1; then
            git clone --depth 1 --branch clash "$PAGES_REPO" /tmp/fpa-pages
          else
            git clone "$PAGES_REPO" /tmp/fpa-pages
            git -C /tmp/fpa-pages checkout --orphan clash
            git -C /tmp/fpa-pages rm -rf . --quiet 2>/dev/null || true
          fi

          git -C /tmp/fpa-pages config user.name "github-actions[bot]"
          git -C /tmp/fpa-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/fpa-pages/docs
          cp docs/clash.yaml /tmp/fpa-pages/docs/clash.yaml
          cp docs/.nojekyll /tmp/fpa-pages/docs/.nojekyll

          git -C /tmp/fpa-pages add docs/clash.yaml docs/.nojekyll
          if git -C /tmp/fpa-pages diff --cached --quiet; then
            echo "No changes to commit."
          else
            git -C /tmp/fpa-pages commit -m "Update Clash subscription"
            git -C /tmp/fpa-pages push -f "$PAGES_REPO" clash
          fi

      - name: Validate Clash Verge subscription
        run: |
          cmp --silent output/clash.yaml docs/clash.yaml
          test -s docs/clash.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("docs/clash.yaml").read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("docs/clash.yaml is not a YAML mapping")

          for key in ("proxies", "proxy-groups", "rules"):
              if not data.get(key):
                  raise SystemExit(f"missing or empty required key: {key}")

          groups = {
              group.get("name"): group
              for group in data["proxy-groups"]
              if isinstance(group, dict)
          }
          required_groups = {
              "AUTO-FAST": "url-test",
              "HK-POOL": "url-test",
              "JP-POOL": "url-test",
              "US-POOL": "url-test",
              "AI-POOL": "url-test",
              "FALLBACK": "fallback",
              "PROXY": "select",
          }
          for name, group_type in required_groups.items():
              group = groups.get(name)
              if not group:
                  raise SystemExit(f"missing proxy group: {name}")
              if group.get("type") != group_type:
                  raise SystemExit(f"{name} must use {group_type}")
              if not group.get("proxies"):
                  raise SystemExit(f"{name} has no proxies")

          rules = data["rules"]
          for rule in (
              "DOMAIN-SUFFIX,openai.com,AI-POOL",
              "DOMAIN-SUFFIX,chatgpt.com,AI-POOL",
              "DOMAIN-SUFFIX,claude.ai,AI-POOL",
              "DOMAIN-SUFFIX,anthropic.com,AI-POOL",
              "GEOIP,CN,DIRECT",
              "MATCH,PROXY",
          ):
              if rule not in rules:
                  raise SystemExit(f"missing rule: {rule}")
          PY
          python -m http.server 8080 --directory docs >/tmp/free-proxy-airport-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --location --output /tmp/docs-clash.yaml --write-out "%{http_code}" http://127.0.0.1:8080/clash.yaml || true)"
            if [ "$http_code" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${http_code:-}" != "200" ]; then
            echo "Expected HTTP 200 from docs/clash.yaml, got ${http_code:-none}"
            exit 1
          fi
          test -s /tmp/docs-clash.yaml
